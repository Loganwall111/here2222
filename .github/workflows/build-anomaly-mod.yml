name: Build Sift Anomaly Fabric Mod
on:
  push:
    branches: [main]
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/**'
      - 'mod_video_assets.zip'
      - 'rift.zip'
      - '.github/workflows/build-anomaly-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build Minecraft 26.2 mod
        run: gradle --no-daemon build
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: sift-anomaly-fabric-26.2
          path: build/libs/sift-anomaly-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
